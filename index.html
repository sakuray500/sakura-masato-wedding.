<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sakura & Masato</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #f8f4ee;
  overflow: hidden;
  font-family: Georgia, serif;
}

* {
  box-sizing: border-box;
}

.scene {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100svh;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.65s ease;
  background: #f8f4ee;
}

.scene.active {
  opacity: 1;
  pointer-events: auto;
}

.scene img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
}

.tap-zone {
  position: absolute;
  inset: 0;
  border: 0;
  background: transparent;
}

.language {
  position: fixed;
  z-index: 100;
  top: max(14px, env(safe-area-inset-top));
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 3px;
  padding: 5px;
  border-radius: 999px;
  background: rgba(255,255,255,.87);
  backdrop-filter: blur(10px);
  box-shadow: 0 7px 25px rgba(70,100,120,.12);
}

.language button {
  border: 0;
  background: transparent;
  padding: 8px 10px;
  border-radius: 999px;
  color: #66849a;
  font-size: 11px;
}

.language button.active {
  background: #7fa8c1;
  color: white;
}

.music {
  position: fixed;
  z-index: 100;
  right: 16px;
  bottom: max(16px, env(safe-area-inset-bottom));
  width: 50px;
  height: 50px;
  border-radius: 50%;
  border: 1px solid white;
  background: rgba(255,255,255,.88);
  color: #567f9b;
  font-size: 20px;
  box-shadow: 0 8px 25px rgba(50,80,100,.13);
}

.butterfly {
  position: absolute;
  width: 24px;
  height: 18px;
  opacity: 0;
  z-index: 4;
  pointer-events: none;
  animation: fly 9s ease-in-out infinite;
}

.butterfly::before,
.butterfly::after {
  content: "";
  position: absolute;
  width: 15px;
  height: 19px;
  top: 0;
  border-radius: 80% 20% 75% 25%;
  background: rgba(215,235,247,.83);
  border: 1px solid rgba(111,155,185,.7);
}

.butterfly::before {
  left: 0;
  transform: rotate(28deg);
}

.butterfly::after {
  right: 0;
  transform: scaleX(-1) rotate(28deg);
}

@keyframes fly {
  0% {
    transform: translateY(70px) translateX(0);
    opacity: 0;
  }
  15% {
    opacity: .75;
  }
  55% {
    transform: translateY(-40px) translateX(35px);
  }
  100% {
    transform: translateY(-130px) translateX(-15px);
    opacity: 0;
  }
}

@media (min-width: 700px) {
  .scene img {
    object-fit: contain;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>

<div class="language">
  <button data-lang="ja">日本語</button>
  <button class="active" data-lang="en">ENGLISH</button>
  <button data-lang="tl">TAGALOG</button>
</div>

<!-- PAGE 1 -->
<section class="scene active" id="scene1">
  <img src="scene1.png" alt="Wedding envelope">
  <button class="tap-zone" id="openEnvelope" aria-label="Open envelope"></button>
</section>

<!-- PAGE 2 -->
<section class="scene" id="scene2">
  <img src="scene2.png" alt="Envelope opening">
</section>

<!-- PAGE 3 -->
<section class="scene" id="scene3">
  <img src="scene3.png" alt="Invitation coming out">
</section>

<!-- PAGE 4 -->
<section class="scene" id="scene4">
  <img src="scene4.png" alt="Invitation with pale pink ribbon">
  <button class="tap-zone" id="untieRibbon" aria-label="Untie ribbon"></button>
</section>

<!-- PAGE 5 -->
<section class="scene" id="scene5">
  <img src="scene5.png" alt="Open wedding invitation">
  <button class="tap-zone" id="openInvitation" aria-label="Open invitation"></button>
</section>

<!-- PAGE 6 -->
<section class="scene" id="scene6">
  <img src="scene6.png" alt="Sakura and Masato wedding information">

  <span class="butterfly"
    style="left:8%; top:78%; animation-delay:.2s">
  </span>

  <span class="butterfly"
    style="right:10%; top:72%; animation-delay:2s">
  </span>

  <span class="butterfly"
    style="left:14%; top:50%; animation-delay:4s">
  </span>

  <span class="butterfly"
    style="right:14%; top:44%; animation-delay:6s">
  </span>
</section>

<button class="music" id="musicButton">♪</button>

<script>
const scenes = [
  document.getElementById("scene1"),
  document.getElementById("scene2"),
  document.getElementById("scene3"),
  document.getElementById("scene4"),
  document.getElementById("scene5"),
  document.getElementById("scene6")
];

function showScene(number) {
  scenes.forEach(scene => scene.classList.remove("active"));
  scenes[number - 1].classList.add("active");
}

/* Envelope opening */
document.getElementById("openEnvelope").addEventListener("click", () => {
  showScene(2);

  setTimeout(() => {
    showScene(3);
  }, 1100);

  setTimeout(() => {
    showScene(4);
  }, 2200);
});

/* Ribbon */
document.getElementById("untieRibbon").addEventListener("click", () => {
  showScene(5);
});

/* Final reveal */
document.getElementById("openInvitation").addEventListener("click", () => {
  showScene(6);
});

/* Language selector */
document.querySelectorAll(".language button").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".language button")
      .forEach(b => b.classList.remove("active"));

    button.classList.add("active");
  });
});

/* Music placeholder */
document.getElementById("musicButton").addEventListener("click", () => {
  alert("Instrumental wedding music will be added here.");
});
</script>

</body>
</html>
